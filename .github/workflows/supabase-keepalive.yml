name: Supabase keepalive

# Les projets Supabase gratuits sont mis en pause après 7 jours sans activité.
# On lance une vraie requête sur la base tous les 3 jours pour garder le projet actif.

on:
  schedule:
    - cron: '23 4 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Variables de dépôt SUPABASE_URL / SUPABASE_ANON_KEY absentes"
            exit 1
          fi

          # Requête réelle sur une table de référence (compte comme activité côté Supabase).
          code="$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/ref_site?select=id&limit=1")"

          echo "HTTP ${code}"
          head -c 500 /tmp/body.txt || true
          echo

          case "$code" in
            2*|401|403|404|406)
              echo "Supabase a répondu (${code}) — projet actif."
              ;;
            *)
              echo "::error::Réponse inattendue de Supabase: ${code}"
              exit 1
              ;;
          esac
