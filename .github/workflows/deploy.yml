name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/workflows/supabase-keepalive.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on n'annule pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Sous-chemin GitHub Pages (site de projet : https://<org>.github.io/<PAGES_BASE_PATH>/).
  # Par défaut le nom du dépôt ; surchargeable via une Variable de dépôt PAGES_BASE_PATH
  # (ex. domaine personnalisé => la définir vide n'est pas supporté ici, garder un segment).
  PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # La configuration Supabase n'est pas versionnée : on la génère à partir des
      # Variables de dépôt. Étape en échec (Variable absente) => build en échec =>
      # déploiement bloqué, le site publié reste intact.
      - name: Write appsettings.json from Actions variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"      || { echo "::error::Variable de dépôt SUPABASE_URL absente"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::Variable de dépôt SUPABASE_ANON_KEY absente"; exit 1; }
          jq -n --arg u "$SUPABASE_URL" --arg k "$SUPABASE_ANON_KEY" \
            '{Supabase:{Url:$u,AnonKey:$k}}' > src/MoaMat.Web/wwwroot/appsettings.json
          echo "appsettings.json généré (Url=$SUPABASE_URL)."

      # Doit se faire AVANT la publication : « dotnet publish » calcule les
      # empreintes SRI de service-worker-assets.js sur le contenu final. Modifier
      # index.html après coup casse la vérification d'intégrité du service worker.
      - name: Set <base href> for project page
        run: |
          index="src/MoaMat.Web/wwwroot/index.html"
          test -n "$PAGES_BASE_PATH" || { echo "::error::PAGES_BASE_PATH vide"; exit 1; }
          grep -q '<base href=' "$index" || { echo "::error::balise <base> introuvable dans $index"; exit 1; }
          sed -i -E "s#<base href=\"[^\"]*\"#<base href=\"/${PAGES_BASE_PATH}/\"#" "$index"
          grep -o '<base href="[^"]*"' "$index"

      - name: Publish (Release)
        run: dotnet publish src/MoaMat.Web/MoaMat.Web.csproj -c Release -o dist --nologo

      # Garde-fou de sécurité : aucun secret Supabase ne doit se retrouver dans les
      # assets publiés. Seule une clé publique (anon / publishable) est admise.
      # Échec ici => build en échec => déploiement bloqué.
      - name: Assert only the anon key ships to the client
        run: |
          root="dist/wwwroot"

          # 1. Rien qui ressemble à une clé de service dans TOUTE la sortie publiée.
          if grep -rIl -e 'service_role' -e 'sb_secret_' -e 'SUPABASE_SERVICE' "$root"; then
            echo "::error::Référence à une clé de service trouvée dans $root"; exit 1
          fi

          # 2. La config ne contient que Url + AnonKey (pas de ServiceKey/ServiceRoleKey…).
          test -f "$root/appsettings.json" || { echo "::error::appsettings.json absent de la sortie"; exit 1; }
          extra="$(jq -r '.Supabase | keys[]' "$root/appsettings.json" | grep -viE '^(Url|AnonKey)$' || true)"
          test -z "$extra" || { echo "::error::Clés inattendues dans Supabase: $extra"; exit 1; }

          # 3. La clé embarquée doit être publique : soit sb_publishable_..., soit un
          #    JWT dont le claim "role" vaut "anon".
          key="$(jq -r '.Supabase.AnonKey' "$root/appsettings.json")"
          case "$key" in
            sb_publishable_*)
              echo "Clé publishable — OK." ;;
            eyJ*.*.*)
              payload="${key#*.}"; payload="${payload%.*}"
              pad=$(( (4 - ${#payload} % 4) % 4 ))
              payload="${payload}$(printf '=%.0s' $(seq 1 $pad))"
              role="$(printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r '.role // empty')"
              echo "JWT role = ${role:-<absent>}"
              test "$role" = "anon" || { echo "::error::La clé Supabase embarquée a le rôle '$role' (attendu: anon)"; exit 1; }
              echo "Clé anon (JWT) — OK." ;;
            *)
              echo "::error::Format de clé Supabase non reconnu (ni sb_publishable_, ni JWT)"; exit 1 ;;
          esac

      # Prouve que la sortie tourne sur un simple serveur de fichiers statiques,
      # sans aucune dépendance ASP.NET Core à l'exécution. Échec => build en échec.
      - name: Smoke test on a plain static server (no ASP.NET Core)
        run: |
          mkdir -p _static_check/"$PAGES_BASE_PATH"
          cp -r dist/wwwroot/. _static_check/"$PAGES_BASE_PATH"/
          python3 -m http.server 8080 --directory _static_check >/dev/null 2>&1 &
          echo $! > /tmp/srv.pid
          for i in $(seq 1 20); do curl -fsS -o /dev/null "http://localhost:8080/$PAGES_BASE_PATH/" && break || sleep 0.5; done
          curl -fsS "http://localhost:8080/$PAGES_BASE_PATH/" -o /tmp/idx.html
          grep -q 'id="app"' /tmp/idx.html
          js="$(grep -oE '_framework/blazor\.webassembly\.[A-Za-z0-9]+\.js' /tmp/idx.html | head -1)"
          test -n "$js" || { echo "::error::script blazor.webassembly introuvable dans index.html"; exit 1; }
          curl -fsS "http://localhost:8080/$PAGES_BASE_PATH/$js" -o /dev/null
          curl -fsS "http://localhost:8080/$PAGES_BASE_PATH/appsettings.json" -o /dev/null
          curl -fsS "http://localhost:8080/$PAGES_BASE_PATH/_framework/blazor.boot.json" -o /dev/null \
            || echo "(blazor.boot.json non exposé sur cette version du SDK — ignoré)"
          kill "$(cat /tmp/srv.pid)" 2>/dev/null || true
          echo "OK — servie par un serveur de fichiers statique pur."

      # index.html n'est pas modifié ici : 404.html et .nojekyll ne sont pas
      # soumis au contrôle d'intégrité du service worker.
      - name: SPA deep-link fallback + disable Jekyll
        run: |
          cp dist/wwwroot/index.html dist/wwwroot/404.html
          touch dist/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
